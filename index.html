<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuStore Search & Download</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container mx-auto p-4 max-w-4xl">
        <!-- Шапка -->
        <div class="flex items-center gap-4 mb-6">
            <span class="text-gray-600 text-sm font-medium">Главная</span>
            <h1 class="text-2xl font-bold text-gray-800">RuStore Search & Download</h1>
        </div>

        <!-- Поиск по названию -->
        <div class="mb-4">
            <input
                type="text"
                id="searchInput"
                placeholder="Поиск приложений..."
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
        </div>

        <!-- Поиск по ссылке -->
        <div class="flex gap-2 mb-6">
            <input
                type="url"
                id="urlInput"
                placeholder="Вставьте ссылку на приложение из RuStore"
                class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
            <button
                id="searchByUrlBtn"
                class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition"
            >
                Найти
            </button>
        </div>

        <!-- Результаты поиска -->
        <div id="searchResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Карточки будут добавляться сюда -->
        </div>

        <!-- Футер -->
        <div class="mt-8 text-center text-sm text-gray-500 border-t pt-4">
            <a
                href="https://github.com/ant783/rustore-search"
                target="_blank"
                class="text-blue-600 hover:underline"
            >
                Исходный код на GitHub
            </a>
        </div>
    </div>

    <!-- Модалка для скачивания -->
    <div id="downloadModal" class="modal hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="modal-content bg-white p-6 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">📦 Скачивание</h2>
                <button class="modal-close text-gray-600 hover:text-gray-800 text-2xl">&times;</button>
            </div>
            <div id="downloadResults" class="text-gray-700"></div>
        </div>
    </div>

    <!-- Модалка для описания -->
    <div id="descriptionModal" class="modal hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="modal-content bg-white p-6 rounded-lg max-w-lg w-full max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold"></h2>
                <button class="modal-close text-gray-600 hover:text-gray-800 text-2xl">&times;</button>
            </div>
            <div id="descriptionContent" class="text-gray-700"></div>
        </div>
    </div>

    <!-- Модалка для превью изображений (не используется) -->
    <div id="imagePreviewModal" class="modal hidden fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50">
        <div class="relative max-w-3xl w-full p-4">
            <button class="absolute top-2 right-2 text-white text-3xl modal-close">&times;</button>
            <button id="prevImage" class="absolute left-2 top-1/2 transform -translate-y-1/2 text-white text-3xl bg-black bg-opacity-50 px-2 py-1 rounded">‹</button>
            <button id="nextImage" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-white text-3xl bg-black bg-opacity-50 px-2 py-1 rounded">›</button>
            <img id="previewImage" src="" alt="Screenshot" class="w-full h-auto rounded" />
            <div id="imageProgress" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-white bg-black bg-opacity-50 px-3 py-1 rounded"></div>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
